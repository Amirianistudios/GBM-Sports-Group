# One-shot bootstrap for the first controlled production import (the data
# plan's staged --max-players 2000 run), triggered by pushing the
# .github/import-trigger file on the working branch.
#
# Exists because workflow_dispatch requires Actions write permission the
# automation token does not hold, and scheduled/UI dispatch only serves the
# default branch. Once the staged import has succeeded and data-refresh.yml
# is on main, this file should be deleted — the weekly refresh is the durable
# mechanism.
#
# Same secrets as data-refresh.yml: NEXT_PUBLIC_SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY. Preflight names whichever is missing and stops
# before anything downloads.
name: staged-import-once

on:
  push:
    branches: [claude/gbm-project-audit-b4dzzs]
    paths: ['.github/import-trigger']

concurrency:
  group: data-refresh
  cancel-in-progress: false

defaults:
  run:
    # GitHub's bare default shell is `bash -e` WITHOUT pipefail, so a failing
    # `pnpm ... | tee log` step reports tee's exit code and the job lies green.
    # The explicit keyword expands to `bash --noprofile --norc -eo pipefail`.
    shell: bash

jobs:
  staged-import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The project URL is public by design; a same-named repository secret
      # overrides it. The service key is the only true secret needed.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://tyzndcjuiffnyhluddce.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Preflight
        run: pnpm ingest:preflight | tee logs-preflight.txt

      - name: Download dataset
        run: pnpm data:download | tee logs-download.txt

      - name: Staged import (2000 players)
        run: pnpm data:import --max-players 2000 | tee logs-import.txt

      - name: Resolve identities (Reep v1)
        run: pnpm reep:resolve | tee logs-resolve.txt

      - name: Recompute discovery signals
        run: pnpm signals:compute | tee logs-signals.txt

      - name: Data quality
        run: pnpm quality:check | tee logs-quality.txt

      - name: Verify end-to-end
        run: pnpm ingest:verify | tee logs-verify.txt

      - name: Run summary
        if: always()
        run: |
          {
            echo '## Staged production import (2000 players)'
            echo '```'
            cat logs-preflight.txt logs-import.txt logs-resolve.txt logs-signals.txt logs-quality.txt logs-verify.txt 2>/dev/null | tail -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-import-logs-${{ github.run_number }}
          path: logs-*.txt
          retention-days: 30
          if-no-files-found: ignore
